services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  backend:
    build:
      context: ./spring-server

    container_name: taskflow-backend

    environment:
      PORT: 4000
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./client

      args:
        VITE_API_URL: ${VITE_API_URL}

    container_name: taskflow-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  taskflow_postgres_data:
